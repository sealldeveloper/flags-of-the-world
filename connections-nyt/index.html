<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NYT Connections — seall.dev</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../crossword/style.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header id="app-header">
    <div class="header-left">
      <a href="/" class="back-link">&#8592; puzzles</a>
      <div class="puzzle-selector-wrap">
        <label for="puzzle-select">Puzzle:</label>
        <select id="puzzle-select" title="Select a Connections puzzle"></select>
        <input type="date" id="puzzle-date" title="Pick any date">
      </div>
    </div>

    <div class="header-center">
      <h1 id="puzzle-title">NYT Connections</h1>
      <div id="puzzle-author" class="puzzle-author">Edited by Wyna Liu</div>
    </div>

    <div class="header-right">
      <span id="puzzle-number" class="puzzle-number" aria-live="polite"></span>
      <button id="btn-theme-toggle" class="btn-sm btn-icon" title="Toggle theme" aria-label="Toggle colour theme">
        <svg id="icon-sun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg id="icon-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" hidden>
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </div>
  </header>

  <main id="connections-app">
    <section id="loading-state" class="state-panel" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <p>Loading puzzle...</p>
    </section>

    <section id="error-state" class="state-panel error-state hidden" role="alert">
      <h2>Couldn’t load this puzzle</h2>
      <p id="error-message">The puzzle service did not respond.</p>
      <button id="retry-button" class="btn-primary" type="button">Retry</button>
    </section>

    <section id="game" class="game-shell hidden" aria-labelledby="game-heading">
      <div class="game-heading-wrap">
        <div>
          <h2 id="game-heading">Create four groups of four!</h2>
          <p id="puzzle-date-label" class="game-date"></p>
        </div>
        <button id="reset-button" class="btn-sm btn-danger-outline" type="button">Reset puzzle</button>
      </div>

      <div id="status-message" class="status-message" aria-live="polite"></div>

      <div id="solved-groups" class="solved-groups" aria-label="Found groups"></div>

      <div id="word-grid" class="word-grid" role="group" aria-label="Connections words"></div>

      <div class="game-footer">
        <div class="mistakes" aria-label="Mistakes remaining">
          <span>Mistakes remaining:</span>
          <span id="mistake-dots" class="mistake-dots" aria-hidden="true"></span>
        </div>
        <div class="game-controls">
          <button id="shuffle-button" class="btn-game" type="button">Shuffle</button>
          <button id="deselect-button" class="btn-game" type="button" disabled>Deselect All</button>
          <button id="submit-button" class="btn-game btn-submit" type="button" disabled>Submit</button>
        </div>
      </div>
    </section>
  </main>

  <div id="result-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="result-title">
    <div class="modal-box result-box">
      <div id="result-icon" class="result-icon" aria-hidden="true"></div>
      <div id="result-title" class="modal-title"></div>
      <div id="result-summary" class="modal-body"></div>
      <div class="result-actions">
        <button id="share-button" class="btn-primary" type="button">Share results</button>
        <button id="result-close" class="btn-sm" type="button">Close</button>
      </div>
    </div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
